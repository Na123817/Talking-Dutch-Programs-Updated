    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    min-height: 100vh;
  }

  /* Header */
  .site-header {
    background: var(--bg);
    color: var(--text);
    padding: 0;
    position: sticky;
    top: 0;
    z-index: 100;
    border-bottom: 1px solid rgba(255,122,26,0.3);
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .header-title {
    font-family: var(--font-display);
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.3px;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .cursor-bar { width: 2px; height: 18px; background: var(--text); opacity: 0.7; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .header-level-badges { display: flex; gap: 6px; margin-left: 2px; }
  .level-badge {
    padding: 3px 11px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .header-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .header-progress { display: flex; align-items: center; gap: 10px; }
  .header-pct { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text); }
  .header-bar-bg { width: 120px; height: 6px; background: rgba(255,255,255,0.1); border-radius: 3px; overflow: hidden; }
  .header-bar-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.4s ease; }

  /* Main */
  .main {
    max-width: 900px;
    margin: 28px auto 40px;
    padding: 32px 28px 40px;
    background: rgba(36,16,4,0.5);
    border: 1px solid var(--accent-border);
    border-radius: var(--radius-lg);
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
  }

  /* Stats */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 24px; }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
    text-align: center;
  }
  .stat-num { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--accent); line-height: 1; }
  .stat-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.8px; }

  /* Filter bar */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
  }
  .filter-btn {
    font-family: var(--font-mono);
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
  }
  .filter-btn:hover { background: var(--accent-soft); }
  .filter-btn.active { background: var(--accent); color: var(--accent-on); border-color: var(--accent); }
  .expand-all {
    margin-left: auto;
    font-family: var(--font-mono);
    text-transform: uppercase;
    font-weight: 600;
    font-size: 11px;
    letter-spacing: 0.5px;
    padding: 6px 14px;
    border-radius: 20px;
    border: 1px solid var(--accent);
    background: transparent;
    color: var(--accent);
    cursor: pointer;
    transition: all 0.15s;
  }
  .expand-all:hover { background: var(--accent-soft); }

  /* Module */
  .module {
    background: rgba(22,10,3,0.74);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 10px;
    overflow: hidden;
    transition: box-shadow 0.15s, border-color 0.15s;
  }
  .module:hover { border-color: var(--accent-border); box-shadow: 0 4px 14px rgba(255,122,26,0.07); }
  .module.hidden { display: none; }

  .module-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 16px;
    cursor: pointer;
    user-select: none;
    background: transparent;
    transition: background 0.1s;
  }
  .module-header:hover { background: rgba(255,255,255,0.03); }

  .mod-num {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .mod-num.complete { background: var(--accent); color: var(--accent-on); }

  .mod-info { flex: 1; min-width: 0; }
  .mod-title { font-family: var(--font-display); font-size: 14px; font-weight: 700; color: var(--text); }
  .mod-sub { font-size: 11px; color: var(--text-muted); margin-top: 1px; }

  .mod-right { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .mod-bar-wrap { display: flex; align-items: center; gap: 8px; }
  .mod-bar-bg { width: 70px; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .mod-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s; }
  .mod-count { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); min-width: 26px; text-align: right; }

  .chevron {
    width: 16px; height: 16px;
    color: var(--text-faint);
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .chevron.open { transform: rotate(180deg); }

  /* Sessions */
  .module-body { display: none; border-top: 1px solid var(--border); }
  .module-body.open { display: block; }

  .session {
    display: grid;
    grid-template-columns: 48px 80px 1fr;
    align-items: start;
    gap: 12px;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    transition: background 0.1s;
  }
  .session:last-child { border-bottom: none; }
  .session.done { background: rgba(255,122,26,0.05); }

  .check-col { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-top: 2px; }
  .check-col input[type=checkbox] {
    width: 18px; height: 18px;
    accent-color: var(--accent);
    cursor: pointer;
    flex-shrink: 0;
  }
  .ses-num-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); text-align: center; }

  .ses-type-col { padding-top: 3px; }
  .ses-letter {
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.3px;
    color: var(--accent);
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    border-radius: 4px;
    padding: 2px 7px;
    display: inline-block;
    margin-bottom: 4px;
  }
  .ses-abs { font-size: 10px; color: var(--text-faint); }

  .ses-content { }
  .fixed-line {
    font-size: 11px;
    color: var(--text-faint);
    margin-bottom: 7px;
    padding-bottom: 7px;
    border-bottom: 1px dashed var(--border);
  }
  .fixed-line span { color: var(--text-muted); font-weight: 500; }
  .fixed-link { color: var(--link); font-weight: 500; text-decoration: underline; text-decoration-color: rgba(255,168,92,0.4); }
  .fixed-link:hover { color: var(--link-hover); }

  .tags { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 8px; }
  .tag {
    font-size: 11px;
    padding: 2px 9px;
    border-radius: 20px;
    border: 1px solid;
    font-weight: 600;
  }
  .tag-p { background: linear-gradient(135deg, rgba(255,179,102,0.16), rgba(255,167,38,0.16)); color: #FFB366; border-color: #FFA726; }
  .tag-t { background: linear-gradient(135deg, rgba(255,167,38,0.16), rgba(255,122,26,0.16)); color: #FFB25E; border-color: #FF7A1A; }
  .tag-a { background: linear-gradient(135deg, rgba(255,122,26,0.16), rgba(232,101,10,0.16)); color: #FF9248; border-color: #E8650A; }
  .tag-c { background: linear-gradient(135deg, rgba(255,138,80,0.16), rgba(193,68,14,0.16)); color: #FF8A50; border-color: #C1440E; }

  .hw-section { }
  .hw-label { font-family: var(--font-mono); font-size: 10px; color: var(--text-faint); margin-bottom: 3px; text-transform: uppercase; letter-spacing: 0.6px; }
  .hw-input {
    width: 100%;
    font-size: 12px;
    padding: 6px 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    background: var(--bg-secondary);
    color: var(--text);
    font-family: inherit;
    resize: vertical;
    min-height: 32px;
    max-height: 400px;
    overflow-y: auto;
    transition: border-color 0.15s;
  }

    font-size: 10px;
    color: var(--accent);
    font-weight: 600;
  }
  .session.done .done-badge { display: block; }

  .tabs { display:flex; gap:8px; margin-bottom:20px; }

  .res-row { display:flex; justify-content:space-between; gap:12px; background:rgba(22,10,3,0.74); border:1px solid var(--border); border-radius:var(--radius-lg); padding:10px 14px; margin-bottom:6px; }

  .stats .stat-card { min-width:0; }

</style>
